<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Presence Dashboard</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <h1>Presence Dashboard</h1>
  <div id="total-active" style="margin-bottom: 10px;">Total Active Users: 0</div>
  <table border="1" cellpadding="10">
    <thead>
      <tr>
        <th>Name</th>
        <th>Status</th>
        <th>Last Active</th>
        <th>Total Active Time</th>
        <th>Daily Logins</th>
      </tr>
    </thead>
    <tbody id="user-table"></tbody>
  </table>

  <script>
    const socket = io();
    const tableBody = document.getElementById("user-table");
    const totalActiveDiv = document.getElementById("total-active");

    socket.on("status-update", data => {
      tableBody.innerHTML = "";
      let activeUsers = 0;

      for (const id in data) {
        const user = data[id];
        if (user.active) activeUsers++;

        const row = document.createElement("tr");

        const nameCell = document.createElement("td");
        nameCell.innerText = user.name;

        const statusCell = document.createElement("td");
        statusCell.innerText = user.active ? "Active" : "Inactive";
        statusCell.style.color = user.active ? "green" : "red";

        const lastCell = document.createElement("td");
        lastCell.innerText = user.lastActive ? new Date(user.lastActive).toLocaleTimeString() : "-";

        const activeCell = document.createElement("td");
        activeCell.innerText = user.activeSeconds + "s";

        const loginCell = document.createElement("td");
        loginCell.innerText = user.dailyLogins;

        row.append(nameCell, statusCell, lastCell, activeCell, loginCell);
        tableBody.appendChild(row);
      }

      totalActiveDiv.innerText = `Total Active Users: ${activeUsers}`;
    });
  </script>
</body>
</html>
