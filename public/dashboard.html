<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Presence Dashboard</title>
<link rel="stylesheet" href="/style.css">
<script src="/socket.io/socket.io.js"></script>
<script src="/client.js"></script>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
h1 { text-align: center; color: #333; }
table { border-collapse: collapse; width: 100%; margin-top: 20px; }
th, td { padding: 12px; text-align: center; border-bottom: 1px solid #ccc; }
th { background: #2F4F4F; color: white; }
tr:hover { background: #f5f5f5; }
.status-badge { border-radius: 5px; padding: 5px 10px; color: white; font-weight: bold; }
.status-active { background-color: #28a745; }
.status-inactive { background-color: #dc3545; }
.time-bar-container { background: #eee; border-radius: 5px; height: 20px; width: 100%; }
.time-bar { height: 100%; border-radius: 5px; background: #007bff; text-align: right; color: white; padding-right: 5px; font-size: 12px; line-height: 20px; }
</style>
</head>
<body>
<h1>Presence Dashboard</h1>
<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Status</th>
      <th>Last Active</th>
      <th>Total Active Time</th>
      <th>Daily Logins</th>
    </tr>
  </thead>
  <tbody id="dashboard-body"></tbody>
</table>
</body>
</html>
