<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Page</title>
<link rel="stylesheet" href="/style.css">
<script src="/socket.io/socket.io.js"></script>
<script src="/client.js"></script>
<style>
body { font-family: Arial; max-width:400px; margin:30px auto; text-align:center; }
input, button { width: 80%; padding:8px; margin:5px 0; font-size:16px; }
#toggle-btn { padding:10px 20px; border:none; cursor:pointer; margin-top:10px; color:white; }
#active-count { margin-top:10px; font-weight:bold; }
</style>
</head>
<body>
<h1>User Page</h1>
<div id="login-form">
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="login-result"></div>
<button id="toggle-btn" onclick="toggleActive()" disabled>Inactive</button>
<div id="active-count">Other active users: 0</div>
</body>
</html>
